name: ScamShield CI

on:
  push:
    branches: ["main", "fix/**", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    name: Backend Unit Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend unit tests
        env:
          TESTING: "1"
          HMAC_SECRET: "ci-test-secret-not-for-production"
        run: python -m unittest backend/test_scamshield.py -v

  mcp-self-test:
    name: MCP Server Self-Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run MCP server self-test
        env:
          HMAC_SECRET: "ci-test-secret-not-for-production"
        run: python mcp_server/server.py --test

      - name: Run incident-tool unit tests
        env:
          HMAC_SECRET: "ci-test-secret-not-for-production"
        run: python -m unittest mcp_server/test_incident.py -v

      - name: End-to-end Streamable HTTP check (official MCP client)
        env:
          HMAC_SECRET: "ci-test-secret-not-for-production"
        run: python mcp_server/e2e_http_check.py

  benchmark-evaluation:
    name: Benchmark Evaluation (Detection Accuracy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run benchmark evaluation
        env:
          HMAC_SECRET: "ci-test-secret-not-for-production"
        run: python evaluation/evaluate.py --min-accuracy 0.90

  frontend-lint-build:
    name: Frontend Lint & Build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: "https://example.com"
        run: npm run build
